name: Deterministic tests

# Runs the full deterministic test suite on every push to main and on
# every PR. This covers:
#   - tests/test_watcher.py        (30 safety-allowlist + behaviour tests)
#   - tests/test_storage.py        (12 SQLite AlertStore tests)
#   - tests/test_hybrid_retriever.py (13 hybrid + query-rewriter tests)
#
# Total: 55 deterministic tests, ~30 s wall clock. None of these require
# Groq access — the e2e suite (tests/test_e2e.py) needs a live Groq token
# and is run locally / in pre-release validation, not CI.
#
# Filename is kept as `watcher-tests.yml` so the README badge URL stays
# stable; the workflow's display name has been updated to reflect the
# expanded scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Deterministic tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        # The hybrid retriever tests need chromadb + rank_bm25; the
        # query-rewriter import touches langchain_groq even though the
        # tests stub the LLM. Installing requirements.txt covers all
        # three deterministic test files in one shot.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic tests
        run: |
          python -m pytest \
            tests/test_watcher.py \
            tests/test_storage.py \
            tests/test_hybrid_retriever.py \
            -v
